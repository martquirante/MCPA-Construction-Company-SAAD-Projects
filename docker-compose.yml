version: '3.8'

services:
  # =============================================================================
  # 1. LOCAL POSTGRESQL DATABASE
  # Isolated database engine preloaded with MCPA schema and initial admin seeds
  # =============================================================================
  postgres_db:
    image: postgres:16-alpine
    container_name: mcpa_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcpa_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mcpa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcpa_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # 2. WEB DATABASE GUI (Adminer)
  # Direct web browser management tool at http://localhost:8080
  # =============================================================================
  adminer:
    image: adminer:latest
    container_name: mcpa_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
    depends_on:
      postgres_db:
        condition: service_healthy

  # =============================================================================
  # 3. AZURITE (Official Microsoft Azure Blob Storage Local Emulator)
  # Blob Service Port: 10000 | Queue: 10001 | Table: 10002
  # =============================================================================
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: mcpa_azurite_storage
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  # =============================================================================
  # 4. ENTERPRISE BACKEND REST API (Express.js)
  # Connects automatically to postgres_db and azurite inside the Docker network
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcpa_backend_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - LOCAL_DB_CONNECTION=postgres://postgres:postgres_local_password@postgres_db:5432/mcpa_dev_db
    depends_on:
      postgres_db:
        condition: service_healthy
      azurite:
        condition: service_started

  # =============================================================================
  # 5. FRONTEND WEB APPLICATION (Next.js)
  # Accessible at http://localhost:3000
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcpa_frontend_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mcpa_pgdata:
  azurite_data:
